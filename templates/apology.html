{% extends "layout.html" %}

{% block title %}Error {{ top }}{% endblock %}

{% block main %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6 text-center py-5">
        <div class="card shadow-sm border-0 p-4">
            <div class="display-1 text-danger fw-bold mb-3">{{ top }}</div>
            <h3 class="fw-bold mb-3">Notice</h3>
            <p class="lead text-muted mb-4">{{ bottom }}</p>
            <div>
                <a href="/" class="btn btn-primary px-4 py-2">
                    <i class="fa-solid fa-house me-2"></i> Return to Feed
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
