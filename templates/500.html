{% extends "layout.html" %}

{% block title %}Server Error (500){% endblock %}

{% block main %}
<div class="row justify-content-center">
    <div class="col-md-7 text-center py-5">
        <div class="card shadow-sm border-0 p-4 p-md-5">
            <div class="display-1 text-danger fw-bold mb-2">500</div>
            <h3 class="fw-bold text-dark mb-2">Something Went Wrong</h3>
            <p class="text-muted lead mb-4">
                Our mohalla server encountered an unexpected glitch. Please try refreshing or return to the feed.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="/" class="btn btn-success px-4 py-2 fw-semibold">
                    <i class="fa-solid fa-house me-1"></i> Back to Feed
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
