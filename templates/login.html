{% extends "layout.html" %}

{% block title %}Log In{% endblock %}

{% block main %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="display-6 text-success mb-2">
                        <i class="fa-solid fa-right-to-bracket"></i>
                    </div>
                    <h3 class="fw-bold">Namaste! Welcome Back</h3>
                    <p class="text-muted small">Sign in to your NeighborGrid account to connect with your mohalla.</p>
                </div>

                <form action="/login" method="post" autocomplete="off">
                    <input type="hidden" name="csrf_token" value="{{ session.get('csrf_token') }}">
                    
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-user text-muted"></i></span>
                            <input autofocus class="form-control" id="username" name="username" placeholder="Username" type="text" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input class="form-control" id="password" name="password" placeholder="Password" type="password" required>
                        </div>
                    </div>

                    <button class="btn btn-success w-100 py-2 fw-semibold" type="submit">
                        <i class="fa-solid fa-arrow-right-to-bracket me-1"></i> Log In
                    </button>
                </form>

                <div class="text-center mt-4 pt-2 border-top">
                    <p class="text-muted small mb-0">Don't have an account yet? 
                        <a href="/register" class="fw-semibold text-success text-decoration-none">Sign up here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
