{% extends "layout.html" %}

{% block title %}Page Not Found (404){% endblock %}

{% block main %}
<div class="row justify-content-center">
    <div class="col-md-7 text-center py-5">
        <div class="card shadow-sm border-0 p-4 p-md-5">
            <div class="display-1 text-warning fw-bold mb-2">404</div>
            <h3 class="fw-bold text-dark mb-2">Mohalla Page Not Found</h3>
            <p class="text-muted lead mb-4">
                The post, profile, or page you were looking for doesn't exist, may have expired, or has moved to a different lane.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="/" class="btn btn-success px-4 py-2 fw-semibold">
                    <i class="fa-solid fa-house me-1"></i> Return to Mohalla Feed
                </a>
                <a href="/guidelines" class="btn btn-outline-secondary px-3 py-2">
                    <i class="fa-solid fa-shield-heart me-1"></i> Guidelines
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
